name: Day / night scene

on:
  schedule:
    - cron: "7 * * * *"      # every hour; the script decides sunrise / day / sunset / night in IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Pick the scene for the current IST hour
        id: scene
        run: bash scripts/set-scene.sh

      - name: Commit only when the scene changed
        run: |
          if git diff --quiet; then
            echo "Scene unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/header.svg
          git commit -m "scene: ${{ steps.scene.outputs.mode }}"
          git push
