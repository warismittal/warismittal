name: Green snake

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake from my contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%237CFFCB&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2339d353
            dist/snake-light.svg?palette=github-light&color_snake=%230f4d24&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216e39
            dist/snake-aurora.gif?palette=github-dark&color_background=%23020a08&color_snake=%23a8ffda&color_dots=%23060e0b,%230f241b,%231f4b38,%2337a06f,%23f5fff9

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "snake: refresh"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
