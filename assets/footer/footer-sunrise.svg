<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe2a8"/><stop offset=".5" stop-color="#ff9d5c"/><stop offset="1" stop-color="#e2457a"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb36b" stop-opacity="0"/><stop offset=".5" stop-color="#ffb36b"/><stop offset="1" stop-color="#ffb36b" stop-opacity="0"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1d4a" stop-opacity="0"/><stop offset=".3" stop-color="#2b1d4a"/><stop offset=".72" stop-color="#e0674a"/><stop offset="1" stop-color="#ffc27a"/></linearGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#fff6d6"/><stop offset=".6" stop-color="#ffb36b"/><stop offset="1" stop-color="#ff7a59"/></radialGradient>
<radialGradient id="gl"><stop offset="0" stop-color="#ffb36b" stop-opacity=".55"/><stop offset="1" stop-color="#ffb36b" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-5%" y="-40%" width="110%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".5"/></filter>
<clipPath id="c"><rect width="1200" height="142"/></clipPath></defs>
<style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.tw circle{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.15}}
.w{animation:wv linear infinite}@keyframes wv{to{transform:translateX(-300px)}}
.sun{animation:b 7s ease-in-out infinite}@keyframes b{50%{transform:translateY(6px)}}
.sp{animation:sp 2.2s ease-in-out infinite}@keyframes sp{50%{opacity:.15}}</style>
<rect width="1200" height="142" fill="url(#sky)"/>
<rect y="142" width="1200" height="58" fill="#2a1420"/>
<g class="tw"><circle cx="286" cy="68" r="0.9" fill="#fff" style="animation-delay:2.7s"/><circle cx="569" cy="72" r="1.2" fill="#fff" style="animation-delay:0.0s"/><circle cx="1005" cy="36" r="0.6" fill="#fff" style="animation-delay:0.6s"/><circle cx="861" cy="68" r="1.2" fill="#fff" style="animation-delay:1.4s"/><circle cx="767" cy="23" r="1.2" fill="#fff" style="animation-delay:0.5s"/><circle cx="1111" cy="50" r="0.6" fill="#fff" style="animation-delay:2.0s"/><circle cx="77" cy="92" r="1.2" fill="#fff" style="animation-delay:0.1s"/><circle cx="936" cy="100" r="0.9" fill="#fff" style="animation-delay:1.4s"/></g>
<g clip-path="url(#c)"><g class="sun"><circle cx="600" cy="150" r="174" fill="url(#gl)"/><circle cx="600" cy="150" r="58" fill="url(#sun)"/></g></g>
<rect x="525" y="146" width="151" height="2" rx="1" fill="#ffb36b" opacity="0.55" class="sp" style="animation-delay:0.0s"/><rect x="539" y="155" width="122" height="2" rx="1" fill="#ffb36b" opacity="0.47" class="sp" style="animation-delay:0.3s"/><rect x="551" y="164" width="99" height="2" rx="1" fill="#ffb36b" opacity="0.39" class="sp" style="animation-delay:0.6s"/><rect x="565" y="173" width="70" height="2" rx="1" fill="#ffb36b" opacity="0.31" class="sp" style="animation-delay:0.9s"/><rect x="577" y="182" width="46" height="2" rx="1" fill="#ffb36b" opacity="0.23" class="sp" style="animation-delay:1.2s"/><rect x="586" y="191" width="29" height="2" rx="1" fill="#ffb36b" opacity="0.15" class="sp" style="animation-delay:1.5s"/><path d="M0,150 Q150,144 300,150 T600,150 T900,150 T1200,150 T1500,150" fill="none" stroke="#ffc98a" stroke-opacity="0.35" stroke-width="1.2" class="w" style="animation-duration:6s"/><path d="M0,159 Q150,153 300,159 T600,159 T900,159 T1200,159 T1500,159" fill="none" stroke="#ffc98a" stroke-opacity="0.29" stroke-width="1.2" class="w" style="animation-duration:8s"/><path d="M0,168 Q150,162 300,168 T600,168 T900,168 T1200,168 T1500,168" fill="none" stroke="#ffc98a" stroke-opacity="0.23" stroke-width="1.2" class="w" style="animation-duration:10s"/><path d="M0,177 Q150,171 300,177 T600,177 T900,177 T1200,177 T1500,177" fill="none" stroke="#ffc98a" stroke-opacity="0.17" stroke-width="1.2" class="w" style="animation-duration:12s"/><path d="M0,186 Q150,180 300,186 T600,186 T900,186 T1200,186 T1500,186" fill="none" stroke="#ffc98a" stroke-opacity="0.11" stroke-width="1.2" class="w" style="animation-duration:14s"/>
<rect y="141" width="1200" height="1.5" fill="url(#ln)" opacity=".8"/>
<text x="600" y="52" text-anchor="middle" font-size="22" font-weight="600" letter-spacing="2" fill="url(#g)" filter="url(#sh)" transform="translate(0,0)">Thanks for stopping by — let's build something that stands out.</text>
<text x="600" y="190" text-anchor="middle" font-size="11" letter-spacing="5" fill="#ffd9b0">WARIS  ·  BUILT IN THE QUIET HOURS</text>
</svg>