<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#fff1d6"/><stop offset="1" stop-color="#ffd08a"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff2c6" stop-opacity="0"/><stop offset=".5" stop-color="#fff2c6"/><stop offset="1" stop-color="#fff2c6" stop-opacity="0"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d4f8f" stop-opacity="0"/><stop offset=".3" stop-color="#1d4f8f"/><stop offset=".72" stop-color="#6ea8dc"/><stop offset="1" stop-color="#ffe1b0"/></linearGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#fff1c2"/><stop offset="1" stop-color="#ffd27a"/></radialGradient>
<radialGradient id="gl"><stop offset="0" stop-color="#fff2c6" stop-opacity=".55"/><stop offset="1" stop-color="#fff2c6" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-5%" y="-40%" width="110%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".5"/></filter>
<clipPath id="c"><rect width="1200" height="142"/></clipPath></defs>
<style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.tw circle{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.15}}
.w{animation:wv linear infinite}@keyframes wv{to{transform:translateX(-300px)}}
.sun{animation:b 7s ease-in-out infinite}@keyframes b{50%{transform:translateY(6px)}}
.sp{animation:sp 2.2s ease-in-out infinite}@keyframes sp{50%{opacity:.15}}</style>
<rect width="1200" height="142" fill="url(#sky)"/>
<rect y="142" width="1200" height="58" fill="#0f2a3d"/>
<g class="tw"></g>
<g clip-path="url(#c)"><g class="sun"><circle cx="1085" cy="100" r="102" fill="url(#gl)"/><circle cx="1085" cy="100" r="34" fill="url(#sun)"/></g></g>
<rect x="1041" y="146" width="88" height="2" rx="1" fill="#fff2c6" opacity="0.55" class="sp" style="animation-delay:0.0s"/><rect x="1049" y="155" width="71" height="2" rx="1" fill="#fff2c6" opacity="0.47" class="sp" style="animation-delay:0.3s"/><rect x="1056" y="164" width="58" height="2" rx="1" fill="#fff2c6" opacity="0.39" class="sp" style="animation-delay:0.6s"/><rect x="1065" y="173" width="41" height="2" rx="1" fill="#fff2c6" opacity="0.31" class="sp" style="animation-delay:0.9s"/><rect x="1071" y="182" width="27" height="2" rx="1" fill="#fff2c6" opacity="0.23" class="sp" style="animation-delay:1.2s"/><rect x="1076" y="191" width="17" height="2" rx="1" fill="#fff2c6" opacity="0.15" class="sp" style="animation-delay:1.5s"/><path d="M0,150 Q150,144 300,150 T600,150 T900,150 T1200,150 T1500,150" fill="none" stroke="#fff1c2" stroke-opacity="0.35" stroke-width="1.2" class="w" style="animation-duration:6s"/><path d="M0,159 Q150,153 300,159 T600,159 T900,159 T1200,159 T1500,159" fill="none" stroke="#fff1c2" stroke-opacity="0.29" stroke-width="1.2" class="w" style="animation-duration:8s"/><path d="M0,168 Q150,162 300,168 T600,168 T900,168 T1200,168 T1500,168" fill="none" stroke="#fff1c2" stroke-opacity="0.23" stroke-width="1.2" class="w" style="animation-duration:10s"/><path d="M0,177 Q150,171 300,177 T600,177 T900,177 T1200,177 T1500,177" fill="none" stroke="#fff1c2" stroke-opacity="0.17" stroke-width="1.2" class="w" style="animation-duration:12s"/><path d="M0,186 Q150,180 300,186 T600,186 T900,186 T1200,186 T1500,186" fill="none" stroke="#fff1c2" stroke-opacity="0.11" stroke-width="1.2" class="w" style="animation-duration:14s"/>
<rect y="141" width="1200" height="1.5" fill="url(#ln)" opacity=".8"/>
<text x="600" y="52" text-anchor="middle" font-size="22" font-weight="600" letter-spacing="2" fill="url(#g)" filter="url(#sh)" >Thanks for stopping by — let's build something that stands out.</text>
<text x="600" y="190" text-anchor="middle" font-size="11" letter-spacing="5" fill="#e6f1fb">WARIS  ·  BUILT IN THE QUIET HOURS</text>
</svg>