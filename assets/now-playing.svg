<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0f1f"/><stop offset=".55" stop-color="#121826"/><stop offset="1" stop-color="#0d1a14"/></linearGradient>
<linearGradient id="eq" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#26a641"/><stop offset=".6" stop-color="#7cffcb"/><stop offset="1" stop-color="#ffb36b"/></linearGradient>
<linearGradient id="pr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7cffcb"/><stop offset="1" stop-color="#ffb36b"/></linearGradient>
<radialGradient id="lab"><stop offset="0" stop-color="#ffcf8a"/><stop offset="1" stop-color="#e8743b"/></radialGradient>
<filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
<clipPath id="c"><rect width="900" height="150" rx="20"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.mono{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.disc{transform-origin:75px 75px;animation:spin 3.6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.arm{transform-origin:138px 22px;animation:arm 1.2s ease-out forwards}@keyframes arm{from{transform:rotate(-28deg)}to{transform:rotate(0)}}
.prog{transform-box:fill-box;transform-origin:left;animation:pg 200s linear infinite}@keyframes pg{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.knob{animation:kn 200s linear infinite}@keyframes kn{from{transform:translateX(0)}to{transform:translateX(330px)}}
.glow{animation:gw 4s ease-in-out infinite}@keyframes gw{50%{opacity:.35}}
.live{animation:lv 1.4s ease-in-out infinite}@keyframes lv{50%{opacity:.3}}
</style>
<g clip-path="url(#c)">
<rect width="900" height="150" fill="url(#bg)"/>
<ellipse class="glow" cx="100" cy="75" rx="120" ry="70" fill="#e8743b" opacity=".2" filter="url(#gl)"/>
<ellipse class="glow" cx="760" cy="90" rx="160" ry="60" fill="#26a641" opacity=".18" filter="url(#gl)" style="animation-delay:2s"/>
<g transform="translate(14,0)">
 <g class="disc"><circle cx="75" cy="75" r="58" fill="#0b0b0f"/><circle cx="75" cy="75" r="20" fill="none" stroke="#fff" stroke-opacity=".06"/><circle cx="75" cy="75" r="25" fill="none" stroke="#fff" stroke-opacity=".06"/><circle cx="75" cy="75" r="30" fill="none" stroke="#fff" stroke-opacity=".06"/><circle cx="75" cy="75" r="35" fill="none" stroke="#fff" stroke-opacity=".06"/><circle cx="75" cy="75" r="40" fill="none" stroke="#fff" stroke-opacity=".06"/><circle cx="75" cy="75" r="45" fill="none" stroke="#fff" stroke-opacity=".06"/><circle cx="75" cy="75" r="50" fill="none" stroke="#fff" stroke-opacity=".06"/><circle cx="75" cy="75" r="55" fill="none" stroke="#fff" stroke-opacity=".06"/><path d="M75,17 A58,58 0 0 1 128,52" stroke="#fff" stroke-opacity=".18" stroke-width="3" fill="none"/>
  <circle cx="75" cy="75" r="19" fill="url(#lab)"/><text x="75" y="79" text-anchor="middle" font-size="9" font-weight="800" fill="#2a1405" class="mono">W</text><circle cx="75" cy="75" r="2.5" fill="#0b0b0f"/></g>
 <g class="arm"><circle cx="138" cy="22" r="6" fill="#c9d1d9"/><path d="M138,22 L126,74 L116,86" stroke="#c9d1d9" stroke-width="3.5" fill="none" stroke-linecap="round"/><rect x="108" y="82" width="12" height="7" rx="2" fill="#e6edf3" transform="rotate(35 114 85)"/></g>
</g>
<circle class="live" cx="186" cy="38" r="4" fill="#7cffcb"/>
<text class="mono" x="198" y="42" font-size="12" letter-spacing="3" fill="#7cffcb">ON REPEAT WHILE I CODE</text>
<text x="184" y="82" font-size="34" font-weight="800" fill="#f0f6fc">Human</text>
<text x="186" y="106" font-size="16" fill="#c9d1d9">Rag'n'Bone Man</text>
<rect x="186" y="122" width="330" height="4" rx="2" fill="#fff" opacity=".12"/>
<rect class="prog" x="186" y="122" width="330" height="4" rx="2" fill="url(#pr)"/>
<circle class="knob" cx="186" cy="124" r="6" fill="#fff"/>
<text class="mono" x="530" y="128" font-size="12" fill="#8b949e">3:20</text>
