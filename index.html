<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <title>Human — Waris is listening</title>
  <style>
    :root { color-scheme: dark; --mint:#7cffcb; --green:#39d353; --bg:#0d1117; }
    * { box-sizing:border-box }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      background: radial-gradient(ellipse at 18% 48%, #4b292b 0%, transparent 38%),
                  radial-gradient(ellipse at 88% 50%, #123c2d 0%, transparent 42%), var(--bg);
      color:#f0f6fc; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap { width:min(760px,100%); }
    .eyebrow { color:var(--mint); letter-spacing:.24em; font:700 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin:0 0 14px 8px; }
    .player {
      display:grid; grid-template-columns:142px minmax(0,1fr) 210px; align-items:center; gap:22px;
      padding:22px; border:1px solid #38404b; border-radius:26px;
      background:linear-gradient(115deg,rgba(72,37,43,.78),rgba(18,23,36,.96) 43%,rgba(13,35,27,.9));
      box-shadow:0 24px 80px #0008, inset 0 1px #ffffff12;
    }
    .vinyl {
      width:142px; aspect-ratio:1; border-radius:50%; position:relative; display:grid; place-items:center;
      background:repeating-radial-gradient(circle at center,#101114 0 3px,#202126 4px 5px,#090a0c 6px 8px);
      box-shadow:0 0 0 5px #090a0c, 0 0 36px #f4774738;
    }
    .vinyl:before { content:""; position:absolute; width:35%; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle at 35% 30%,#ffd18b,#ff8747 54%,#a73b21); box-shadow:0 0 16px #ff8c4c77; }
    .vinyl:after { content:""; position:absolute; width:7px;height:7px;border-radius:50%;background:#111;z-index:2; }
    .arm { position:absolute; width:7px;height:78px; background:#d6e0e8; border-radius:8px; right:4px;top:-4px; transform:rotate(14deg); transform-origin:top; z-index:3; }
    .arm:after { content:"";position:absolute;bottom:-3px;left:-5px;width:16px;height:10px;border-radius:3px;background:#d6e0e8;transform:rotate(30deg); }
    .meta { min-width:0; }
    .status { color:var(--mint); font:700 11px ui-monospace,monospace; letter-spacing:.22em; margin-bottom:9px; }
    h1 { font-size:clamp(32px,6vw,46px); line-height:1; margin:0 0 8px; letter-spacing:-.04em; }
    .artist { color:#c9d1d9; font-size:17px; margin-bottom:24px; }
    .controls { display:flex; align-items:center; gap:12px; }
    button {
      border:0; border-radius:50%; width:52px;height:52px; display:grid;place-items:center;
      background:var(--mint);color:#061b14;cursor:pointer; flex:none; box-shadow:0 0 28px #7cffcb35;
      transition:transform .16s ease,filter .16s ease;
    }
    button:hover { transform:scale(1.06);filter:brightness(1.08) }
    button:focus-visible { outline:3px solid white;outline-offset:4px }
    button svg { width:22px;height:22px;fill:currentColor }
    .timeline { flex:1; min-width:0; }
    input[type=range] { width:100%; accent-color:var(--mint); cursor:pointer; }
    .times { display:flex;justify-content:space-between;color:#9ba6b2;font:12px ui-monospace,monospace;margin-top:3px; }
    .visualizer { height:82px; display:flex;align-items:center;justify-content:center;gap:5px; }
    .visualizer i { display:block;width:5px;border-radius:5px;background:linear-gradient(to top,#39d353,#7cffcb,#ffc078);height:var(--h);opacity:.9; }
    .playing .visualizer i { animation:pulse .8s ease-in-out infinite alternate; animation-delay:var(--d); }
    @keyframes pulse { from{transform:scaleY(.42);opacity:.6} to{transform:scaleY(1);opacity:1} }
    .hint { text-align:center;color:#8b949e;font-size:13px;line-height:1.6;margin:18px 8px 0; }
    .hint strong { color:#c9d1d9;font-weight:600 }
    .links { display:flex;justify-content:center;gap:20px;margin-top:20px;font-size:13px; }
    .links a { color:#c9d1d9;text-decoration:none }
    .links a:hover { color:var(--mint) }
    @media(max-width:620px) {
      .player { grid-template-columns:84px 1fr; gap:16px; padding:17px; }
      .vinyl { width:84px; }
      .arm { height:48px; }
      .visualizer { grid-column:1/-1;height:44px; }
      .artist { margin-bottom:15px;font-size:15px; }
      .status {font-size:9px;letter-spacing:.15em}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">NOW PLAYING WHILE I CODE</p>
    <section class="player" id="playerCard" aria-label="Human music player">
      <div class="vinyl" aria-hidden="true"><span class="arm"></span></div>
      <div class="meta">
        <div class="status" id="status">● READY WHEN YOU ARE</div>
        <h1>Human</h1>
        <div class="artist">Rag'n'Bone Man</div>
        <div class="controls">
          <button id="toggle" type="button" aria-label="Play song">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" hidden><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>
          <div class="timeline">
            <input id="seek" type="range" min="0" max="100" value="0" aria-label="Seek song">
            <div class="times"><span id="current">0:00</span><span id="duration">3:20</span></div>
          </div>
        </div>
      </div>
      <div class="visualizer" id="visualizer" aria-hidden="true"></div>
    </section>
    <p class="hint"><strong>Press play, then keep browsing.</strong><br>Audio continues while this page stays open in a background tab.</p>
    <nav class="links">
      <a href="https://github.com/warismittal">GitHub</a>
      <a href="https://open.spotify.com/search/Human%20Rag%27n%27Bone%20Man">Spotify</a>
      <a href="https://www.youtube.com/results?search_query=Rag%27n%27Bone+Man+Human+Official+Video">YouTube</a>
    </nav>
    <audio id="audio" preload="metadata" src="https://github.com/user-attachments/files/35186714/Rag.n.Bone.Man.-.Human.Official.Video.mp3"></audio>
  </main>
<script>
  const audio = document.getElementById('audio');
  const toggle = document.getElementById('toggle');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const statusEl = document.getElementById('status');
  const seek = document.getElementById('seek');
  const current = document.getElementById('current');
  const duration = document.getElementById('duration');
  const card = document.getElementById('playerCard');
  const visualizer = document.getElementById('visualizer');

  const heights = [25,48,35,62,76,42,30,53,39,67,28,58,44,72,33,51,26,63,38,55,31,70];
  heights.forEach((h,i) => {
    const bar = document.createElement('i');
    bar.style.setProperty('--h', h + 'px');
    bar.style.setProperty('--d', (i * -0.075) + 's');
    visualizer.appendChild(bar);
  });

  const fmt = n => {
    if (!Number.isFinite(n)) return '0:00';
    return Math.floor(n/60) + ':' + String(Math.floor(n%60)).padStart(2,'0');
  };
  function setPlaying(playing) {
    playIcon.hidden = playing;
    pauseIcon.hidden = !playing;
    toggle.setAttribute('aria-label', playing ? 'Pause song' : 'Play song');
    statusEl.textContent = playing ? '● ON REPEAT WHILE YOU CODE' : '● PAUSED — READY TO RESUME';
    card.classList.toggle('playing', playing);
  }
  toggle.addEventListener('click', async () => {
    try {
      if (audio.paused) {
        await audio.play();
        setPlaying(true);
      } else {
        audio.pause();
        setPlaying(false);
      }
    } catch (err) {
      statusEl.textContent = '● AUDIO COULD NOT LOAD';
      console.error(err);
      alert('The song could not load. Check that the GitHub audio attachment is still accessible.');
    }
  });
  audio.addEventListener('loadedmetadata', () => {
    duration.textContent = fmt(audio.duration);
    seek.max = Math.floor(audio.duration || 0);
  });
  audio.addEventListener('timeupdate', () => {
    current.textContent = fmt(audio.currentTime);
    if (!seek.matches(':active')) seek.value = Math.floor(audio.currentTime);
  });
  seek.addEventListener('input', () => { current.textContent = fmt(Number(seek.value)); });
  seek.addEventListener('change', () => { audio.currentTime = Number(seek.value); });
  audio.addEventListener('play', () => setPlaying(true));
  audio.addEventListener('pause', () => setPlaying(false));
  audio.addEventListener('ended', () => { setPlaying(false); audio.currentTime = 0; });
</script>
</body>
</html>
